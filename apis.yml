  description: The Forto Public API provides programmatic access to Forto's digital freight forwarding platform. It exposes
    booking management (create, update, finalize, discard, list), shipment operations (list, get, documents, invoices, reports),
    multi-version transport plans with milestone events, subscription-based webhooks for change notifications, and OAuth-style
    token management. Integrations can be implemented out-of-the-box via the REST API, through predefined EDI flows, or as
    fully customized integrations into SAP, Infor Nexus, Oracle, and other enterprise systems.
